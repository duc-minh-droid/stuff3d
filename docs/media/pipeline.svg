<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #121813; stroke: #2c3a2e; stroke-width: 1.5; }
    .hot { stroke: #36f56a; }
    .t { fill: #d6e5d8; font-size: 15px; font-weight: 600; }
    .s { fill: #7d917f; font-size: 12px; }
    .m { fill: #36f56a; font-size: 12.5px; font-family: Consolas, "Cascadia Mono", monospace; }
    .a { fill: #ffb547; font-size: 12.5px; font-family: Consolas, monospace; }
    .arr { stroke: #36f56a; stroke-width: 2; fill: none; marker-end: url(#h); }
    .lbl { fill: #7d917f; font-size: 11px; letter-spacing: .08em; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#36f56a"/>
    </marker>
  </defs>
  <rect width="1000" height="430" rx="14" fill="#0b0f0c"/>
  <text x="30" y="40" fill="#d6e5d8" font-size="20" font-weight="700">Stuff3D vertex pipeline</text>
  <text x="30" y="62" class="s">run_pipeline() in src/main.cpp, applied to all 324 vertices every frame. No matrices, just these functions.</text>

  <!-- row 1: model -> world -->
  <text x="30" y="98" class="lbl">MODEL  →  WORLD</text>
  <rect class="box" x="30" y="108" width="210" height="96" rx="10"/>
  <text x="46" y="134" class="t">Model space</text>
  <text x="46" y="156" class="m">vs[i] from penger.cpp</text>
  <text x="46" y="178" class="s">penguin centred on origin,</text>
  <text x="46" y="194" class="s">about 1.1 units wide</text>

  <path class="arr" d="M244 156 H292"/>

  <rect class="box" x="296" y="108" width="210" height="96" rx="10"/>
  <text x="312" y="134" class="t">Spin</text>
  <text x="312" y="156" class="m">rotate_y(p, angle)</text>
  <text x="312" y="178" class="m">x' = x·cosθ − z·sinθ</text>
  <text x="312" y="196" class="m">z' = x·sinθ + z·cosθ</text>

  <path class="arr" d="M510 156 H558"/>

  <rect class="box" x="562" y="108" width="190" height="96" rx="10"/>
  <text x="578" y="134" class="t">Push into scene</text>
  <text x="578" y="156" class="m">translate_z(p, dz)</text>
  <text x="578" y="178" class="s">dz = 3: the model sits</text>
  <text x="578" y="194" class="s">3 units down +Z</text>

  <path class="arr" d="M756 156 H804"/>

  <rect class="box" x="808" y="108" width="162" height="96" rx="10"/>
  <text x="824" y="134" class="t">Camera offset</text>
  <text x="824" y="156" class="m">p − camera</text>
  <text x="824" y="178" class="s">W/A/S/D move the</text>
  <text x="824" y="194" class="s">camera along its basis</text>

  <!-- down-and-back connector -->
  <path class="arr" d="M889 208 V240 H130 V262"/>

  <!-- row 2: view -> screen -->
  <text x="30" y="256" class="lbl">VIEW  →  SCREEN</text>
  <rect class="box" x="30" y="268" width="210" height="110" rx="10"/>
  <text x="46" y="294" class="t">View space</text>
  <text x="46" y="316" class="m">rotate_y(p, yaw)</text>
  <text x="46" y="338" class="s">Q/E change yaw. After this</text>
  <text x="46" y="354" class="s">the camera looks down +Z,</text>
  <text x="46" y="370" class="s">right is +X, up is +Y</text>

  <path class="arr" d="M244 322 H292"/>

  <rect class="box hot" x="296" y="268" width="210" height="110" rx="10"/>
  <text x="312" y="294" class="t">Near-plane clip</text>
  <text x="312" y="316" class="a">clip_near(a, b)</text>
  <text x="312" y="338" class="s">edge fully behind z = 0.1: drop</text>
  <text x="312" y="354" class="s">edge crossing it: slide the</text>
  <text x="312" y="370" class="s">back end to z = 0.1 (lerp)</text>

  <path class="arr" d="M510 322 H558"/>

  <rect class="box" x="562" y="268" width="190" height="110" rx="10"/>
  <text x="578" y="294" class="t">Perspective divide</text>
  <text x="578" y="316" class="m">project(p)</text>
  <text x="578" y="338" class="m">(x / z, y / z)</text>
  <text x="578" y="358" class="s">far things shrink; NDC in</text>
  <text x="578" y="372" class="s">[-1, 1] = 90° field of view</text>

  <path class="arr" d="M756 322 H804"/>

  <rect class="box" x="808" y="268" width="162" height="110" rx="10"/>
  <text x="824" y="294" class="t">Screen</text>
  <text x="824" y="316" class="m">screen(p)</text>
  <text x="824" y="338" class="m">(x+1)/2 · W</text>
  <text x="824" y="356" class="m">(1−y)/2 · H</text>
  <text x="824" y="372" class="s">then sf::Lines</text>

  <text x="30" y="410" class="s">Each triangle's three edges are pushed through this chain and drawn as green lines. There is no depth buffer: the model is a wireframe, so draw order does not matter.</text>
</svg>
